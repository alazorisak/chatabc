name: Archive User Submission

on:
  repository_dispatch:
    types: [user_submission]

jobs:
  create-archive-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Create archive folder if missing
        run: mkdir -p archive

      - name: Generate markdown archive file
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FILENAME="archive/submission-${TIMESTAMP}.md"
          
          echo "---" > $FILENAME
          echo "Submitted by: ${{ github.event.client_payload.user }}" >> $FILENAME
          echo "Date: $(date)" >> $FILENAME
          echo "---" >> $FILENAME
          echo "" >> $FILENAME
          echo "${{ github.event.client_payload.text }}" >> $FILENAME

      - name: Commit and push file back to repo
        run: |
          git config --global user.name "Archive Bot"
          git config --global user.email "actions@github.com"
          git add archive/
          git commit -m "Add new user submission by ${{ github.event.client_payload.user }}"
          git push
